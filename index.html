<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ef4135">
  <meta name="description" content="WG 業績計算工具：依 MTD 與目標業績計算 PROJ、達成率、每日目標與今日達標所需。">
  <title>WG小工具</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7288600499250923" crossorigin="anonymous"></script>
</head>
<body>
  <header class="top">
    <img src="icons/icon-192.png" alt="" class="logo" width="36" height="36">
    <h1>WG小工具</h1>
    <button type="button" id="menuBtn" class="menu-btn" aria-haspopup="dialog" aria-controls="formulaDialog">公式</button>
  </header>

  <div class="layout">
  <aside class="ad-rail" aria-label="廣告"><div class="ad-slot" id="adLeft" hidden></div></aside>
  <main>
    <form id="calcForm" class="card" novalidate>
      <div class="field">
        <label class="label" for="dateInput">日期</label>
        <div class="row">
          <input type="date" id="dateInput" required>
          <button type="button" id="todayBtn" class="ghost">跳回今天</button>
        </div>
      </div>

      <label class="field">
        <span class="label">LTD <small>當日業績</small></span>
        <input type="text" id="ltdInput" inputmode="decimal" autocomplete="off" placeholder="0">
      </label>

      <label class="field">
        <span class="label">MTD <small>當月合計業績</small></span>
        <input type="text" id="mtdInput" inputmode="decimal" autocomplete="off" placeholder="0" required>
      </label>

      <div class="field">
        <label class="label" for="goalInput">目標業績 Goal</label>
        <div class="row">
          <input type="text" id="goalInput" inputmode="decimal" autocomplete="off" placeholder="80,000" required>
          <select id="goalSelect" aria-label="選擇預設目標">
            <option value="" selected>預設</option>
            <option>80,000</option>
            <option>110,000</option>
            <option>140,000</option>
            <option>170,000</option>
            <option>250,000</option>
            <option>300,000</option>
            <option>350,000</option>
            <option>500,000</option>
          </select>
        </div>
      </div>

      <p id="error" class="error" role="alert" hidden></p>
      <button type="submit" class="primary">計算</button>
    </form>

    <section class="card results" aria-live="polite">
      <h2>計算結果</h2>
      <dl>
        <div><dt>PROJ</dt><dd id="projOut">未計算</dd></div>
        <div><dt>%</dt><dd id="percentOut">未計算</dd></div>
        <div><dt>DailyNeed</dt><dd id="dailyOut">未計算</dd></div>
        <div><dt>今日達標所需</dt><dd id="currentOut">未計算</dd></div>
      </dl>
    </section>

    <div class="ad-slot ad-bottom" id="adBottom" aria-label="廣告" hidden></div>
  </main>
  <aside class="ad-rail" aria-label="廣告"><div class="ad-slot" id="adRight" hidden></div></aside>
  </div>

  <footer>
    <nav><a href="about.html">使用說明</a> · <a href="/privacy.html">隱私權政策</a></nav>
    <p>© KarzeWorks</p>
  </footer>

  <dialog id="formulaDialog">
    <h2>公式</h2>
    <dl class="formula">
      <dt>LTD</dt><dd>當日業績</dd>
      <dt>MTD</dt><dd>當月合計業績</dd>
      <dt>Goal</dt><dd>當月目標業績</dd>
      <dt>PT(MTD)</dt><dd>當月累計完課數</dd>
      <dt>PROJ</dt><dd>當月預計達成業績<br><code>= MTD / 已過天數 × 當月天數</code></dd>
      <dt>%</dt><dd>當月預計達成率<br><code>= PROJ / Goal</code></dd>
      <dt>DailyNeed</dt><dd>當前每日目標<br><code>= (目標業績 − MTD) / 剩餘天數</code></dd>
      <dt>今日達標所需</dt><dd>今日達到 100% 所需的數字<br><code>= 目標 / 當月天數 × 已過天數 − MTD</code></dd>
    </dl>
    <form method="dialog"><button class="primary">關閉</button></form>
  </dialog>

  <script src="app.js"></script>
  <script src="ads.js"></script>
</body>
</html>
